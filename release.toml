# cargo-release workspace config.
#
# Invoke with:
#
#   cargo release patch --execute    # 0.1.0 -> 0.1.1
#   cargo release minor --execute    # 0.1.0 -> 0.2.0
#   cargo release major --execute    # 0.1.0 -> 1.0.0
#
# Dry-run first:
#
#   cargo release minor --dry-run
#
# See `RELEASING.md` (top-level) for the end-to-end runbook.

allow-branch = ["main"]

# We're not on crates.io. Skip publish.
publish = false

# Don't auto-push. `main` is branch-protected (changes must go via
# pull request), so cargo-release pushing directly would always be
# rejected. Workflow: cargo-release creates the version-bump commit
# and the `vX.Y.Z` tag locally; the maintainer moves them to a
# `release/vX.Y.Z` branch, opens a PR, merges via rebase (or merge
# commit — NEVER squash, which would orphan the tag), and pushes
# the tag manually after merge. Full procedure in `RELEASING.md`.
push = false

# Don't require GPG signing locally. (CI re-signs artifacts via
# Sigstore as part of SLSA provenance.)
sign-tag = false
sign-commit = false

tag-name = "v{{version}}"
tag-message = "Release {{tag_name}}"
pre-release-commit-message = "chore: release {{version}}"

# Pre-release hook: must pass before the version bump commit is made.
# Keep this fast — anything slow belongs in CI, not in the local
# release path.
pre-release-hook = ["cargo", "test", "--workspace", "--locked"]

# NOTE on CHANGELOG.md:
#
# cargo-release resolves `pre-release-replacements` paths relative to
# each crate's directory, not the workspace root. With our single
# workspace-level CHANGELOG.md, defining the replacement here would
# make cargo-release look for `omux/CHANGELOG.md` and
# `omux-hook/CHANGELOG.md` and fail.
#
# Instead, the CHANGELOG-rewrite rule lives in `omux/Cargo.toml`
# under [package.metadata.release], pointing at `../CHANGELOG.md`.
# The omux-hook crate has no replacements and shares the version
# via `version.workspace = true`.
