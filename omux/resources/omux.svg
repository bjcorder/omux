<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background: rounded dark square in Catppuccin Mocha base. -->
  <rect x="6" y="6" width="116" height="116" rx="20" fill="#1e1e2e"/>
  <rect x="6" y="6" width="116" height="116" rx="20" fill="none" stroke="#313244" stroke-width="2"/>

  <!-- Terminal-prompt glyph "&gt;_". -->
  <g font-family="monospace" font-weight="bold" font-size="62" fill="#a6e3a1">
    <text x="22" y="86">&gt;</text>
    <text x="60" y="86" fill="#cdd6f4">_</text>
  </g>

  <!-- Notification dot — accent (Catppuccin red). -->
  <circle cx="98" cy="28" r="13" fill="#f38ba8"/>
  <circle cx="98" cy="28" r="13" fill="none" stroke="#1e1e2e" stroke-width="3"/>
</svg>
