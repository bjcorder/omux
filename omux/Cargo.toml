[package]
name = "omux"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Multi-terminal Linux workspace with agent-attention notifications"

[[bin]]
name = "omux"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
serde.workspace = true
toml.workspace = true
rusqlite.workspace = true
directories.workspace = true
regex.workspace = true
libc.workspace = true
serde_json.workspace = true
gtk4 = { version = "0.10", features = ["v4_18"] }
libadwaita = { version = "0.8", features = ["v1_7"] }
vte4 = { version = "0.9", features = ["v0_78"] }
webkit6 = "0.5"

[dev-dependencies]
tempfile = "3"

# Per-crate cargo-release rules. We put the CHANGELOG rewrite here
# (not in the workspace-level release.toml) because cargo-release
# resolves replacement paths relative to each crate's directory.
# Scoping the rule to `omux` only — with `../CHANGELOG.md` to reach
# back up to the workspace root — keeps the replacement single-firing
# and points it at the actual file. The omux-hook crate inherits the
# shared version via `version.workspace = true` and doesn't need its
# own block.
[package.metadata.release]
pre-release-replacements = [
  { file = "../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] — {{date}}", exactly = 1 },
]
